name: Package dependencies

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install NetworkX
        run: python -m pip install networkx==3.6.1

      - name: Test the graph checker and header parser
        run: python M2/Macaulay2/m2/check-package-dependencies.py --self-test

      - name: Test cycle and missing-header failures
        shell: bash
        run: |
          fixtures=$(mktemp -d)
          trap 'rm -rf "$fixtures"' EXIT
          printf 'AuditA\nAuditB\n' > "$fixtures/=distributed-packages"
          printf 'newPackage("AuditA", PackageImports => {"AuditB"})\n' > "$fixtures/AuditA.m2"
          printf 'newPackage("AuditB", PackageExports => {"AuditA"})\n' > "$fixtures/AuditB.m2"
          status=0
          python M2/Macaulay2/m2/check-package-dependencies.py "$fixtures" > "$fixtures/report" 2>&1 || status=$?
          cat "$fixtures/report"
          test "$status" -eq 1
          grep -F '{AuditA, AuditB}' "$fixtures/report"
          rm "$fixtures/AuditB.m2"
          status=0
          python M2/Macaulay2/m2/check-package-dependencies.py "$fixtures" > "$fixtures/report" 2>&1 || status=$?
          cat "$fixtures/report"
          test "$status" -eq 2
          grep -F 'missing package source:' "$fixtures/report"

      - name: Check declared package dependencies
        run: python M2/Macaulay2/m2/check-package-dependencies.py
