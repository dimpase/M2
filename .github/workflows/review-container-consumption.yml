# Temporary review-only validation; remove before merging.
name: Review PR container consumption
on:
  pull_request:
    branches: [incremental-container-ci]
concurrency:
  group: review-container-consumption-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: read
jobs:
  reuse:
    if: github.repository == 'dimpase/M2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      REVIEW_REVISION: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Export the PR merge revision
        id: snapshot
        run: python3 .github/ci/source_snapshot.py . "$RUNNER_TEMP/m2-review-source" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact published image (no clean fallback)
        env:
          CACHE_KEY: ${{ steps.snapshot.outputs.key }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/m2-ci-cmake:sha-$REVIEW_REVISION-$CACHE_KEY"
          docker pull "$image"
          echo "REVIEW_IMAGE=$(docker image inspect --format '{{.Id}}' "$image")" >> "$GITHUB_ENV"
          echo "Testing $image" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare output timestamp audit
        run: |
          cat > "$RUNNER_TEMP/audit.py" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path('/opt/m2/build')
          # CPack staging contains copies of stamps and binaries, not build outputs.
          paths = [p for p in root.rglob('*') if
                   '_CPack_Packages' not in p.relative_to(root).parts and p.is_file() and
                   (p.suffix in ('.o', '.a', '.so') or
                    p.name in ('M2-binary', '.cmake-installed'))]
          assert any(p.suffix == '.o' for p in paths), 'no cached objects'
          assert any(p.name == '.cmake-installed' for p in paths), 'no package stamps'
          state = {str(p.relative_to(root)): p.stat().st_mtime_ns for p in paths}
          marker = pathlib.Path('/opt/m2/review-before.json')
          if sys.argv[1] == 'before':
              marker.write_text(json.dumps(state))
          else:
              old = json.loads(marker.read_text())
              changed = sorted(k for k in old.keys() | state.keys() if old.get(k) != state.get(k))
              expected = [k for k in old if k.endswith('/Tableaux/.cmake-installed')]
              assert len(expected) == 1, 'Expected one cached Tableaux stamp; found: ' + repr(expected)
              print('Changed outputs:', changed)
              assert changed == expected, 'Unexpected rebuilt outputs: ' + repr(changed[:50])
              print('PASS: only Tableaux reinstalled;', len(state)-1,
                    'compiled outputs and other package stamps preserved')
          PY
      - name: Build the package-only PR and audit output reuse
        run: |
          memory_jobs=$(awk '/MemTotal/ {print int($2 / 2097152)}' /proc/meminfo)
          jobs=$(nproc)
          (( memory_jobs < jobs )) && jobs=$memory_jobs
          (( jobs < 1 )) && jobs=1
          mkdir -p "$RUNNER_TEMP/review-results"
          docker create --name m2-review --init --cap-drop ALL --security-opt no-new-privileges \
            --env "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" \
            --mount "type=bind,source=$RUNNER_TEMP/m2-review-source,target=/input,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/audit.py,target=/audit.py,readonly" \
            "$REVIEW_IMAGE" sleep infinity
          docker start m2-review
          set -o pipefail
          docker exec m2-review bash -c '
              set -e
              tar -xf /opt/m2/build-cache.tar -C /opt/m2
              rm /opt/m2/build-cache.tar
              python3 /audit.py before
              bash /input/.github/ci/container-build.sh build
              tar -xf /opt/m2/build-cache.tar -C /opt/m2
              rm /opt/m2/build-cache.tar
              python3 /audit.py after' 2>&1 | tee "$RUNNER_TEMP/review-results/reuse.log"
      - name: Run all checks against the reused build
        run: |
          set -o pipefail
          docker exec m2-review bash /input/.github/ci/container-build.sh test \
            2>&1 | tee "$RUNNER_TEMP/review-results/tests.log"
      - name: Verify a core edit rebuilds only its affected object
        run: |
          set -o pipefail
          docker exec -i m2-review python3 - <<'PYCORE' 2>&1 | tee "$RUNNER_TEMP/review-results/core-edit.log"
          import os, pathlib, subprocess
          root = pathlib.Path('/opt/m2/build')
          source = pathlib.Path('/opt/m2/source/M2/Macaulay2/e/computations/BRP-interface.cpp')
          expected = 'Macaulay2/e/CMakeFiles/M2-engine.dir/computations/BRP-interface.cpp.o'
          def objects():
              return {str(p.relative_to(root)): p.stat().st_mtime_ns
                      for p in root.rglob('*.o') if p.is_file()}
          before = objects()
          assert expected in before and len(before) > 100, 'missing cached core objects'
          binaries = list(root.glob('usr-dist/*/bin/M2-binary'))
          assert len(binaries) == 1, binaries
          binary = binaries[0]
          linked_before = binary.stat().st_mtime_ns
          retained = list(root.glob('usr-host/**/*.a')) + list(root.rglob('.cmake-installed'))
          timestamps = {p: p.stat().st_mtime_ns for p in retained}
          with source.open('a') as out:
              out.write('\nextern "C" int m2_ci_incremental_probe() { return 4721; }\n')
          env = dict(os.environ, CCACHE_DIR='/opt/m2/ccache', CCACHE_MAXSIZE='512M',
                     OMP_NUM_THREADS='1', OPENBLAS_NUM_THREADS='1')
          subprocess.run(['cmake', '--build', str(root), '--target', 'M2-core'],
                         env=env, check=True)
          after = objects()
          changed = sorted(p for p in before.keys() | after.keys()
                           if before.get(p) != after.get(p))
          assert changed == [expected], changed
          assert binary.stat().st_mtime_ns != linked_before, 'M2 was not relinked'
          assert all(p.stat().st_mtime_ns == t for p, t in timestamps.items()), \
              'core-only build unexpectedly rebuilt dependencies or installed packages'
          subprocess.run([str(root / 'M2'), '-q', '--stop', '-e', 'assert(1+1==2)',
                          '-e', 'exit 0'], env=env, check=True)
          print('PASS: one core object rebuilt; M2 relinked and ran;',
                len(before)-1, 'other objects preserved')
          PYCORE
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/review-results"
          docker cp m2-review:/opt/m2/logs/. "$RUNNER_TEMP/review-results/" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-container-consumption
          path: ${{ runner.temp }}/review-results/
          overwrite: true
      - name: Clean up
        if: always()
        run: docker rm -f m2-review || true
